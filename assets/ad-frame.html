<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Advertisement</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}</style>
</head>
<body>
<script>
// Hosts one Adsterra banner. main.js/ads-content.js load this in an iframe
// with ?k=<key>&w=<width>&h=<height>; a real same-origin URL rather than
// srcdoc/about:blank because invoke.js checks where it's running and stays
// silent on about: origins. Same pattern as calcsolver.com's ad-frame.html.
(function () {
  var q = new URLSearchParams(location.search);
  var key = q.get('k') || '';
  var w = parseInt(q.get('w'), 10), h = parseInt(q.get('h'), 10);
  if (!/^[a-f0-9]{32}$/.test(key) || !(w > 0 && w <= 1000) || !(h > 0 && h <= 1000)) return;
  window.atOptions = { key: key, format: 'iframe', height: h, width: w, params: {} };
  document.write('<script src="https://bauval.org/22/' + key + '"><\/script>');
})();
</script>
</body>
</html>
